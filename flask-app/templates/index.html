<!DOCTYPE html>
<html>
<head>
  <title>Chaos Monitor</title>
  <style>
    body { font-family: Arial; background: #111; color: #0f0; }
    .card { padding: 20px; margin: 10px; border: 1px solid #0f0; }
  </style>
</head>
<body>

<h1>🔥 Chaos Lab Dashboard</h1>

<div class="card">Total Files: {{ files }}</div>
<div class="card">Total Size: {{ size }} bytes</div>
<div class="card">CPU Usage: {{ cpu }}%</div>
<div class="card">Memory Usage: {{ memory }}%</div>
<div class="card">Disk Usage: {{ disk }}%</div>

</body>
</html>
