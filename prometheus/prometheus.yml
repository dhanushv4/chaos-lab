global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "flask"
    metrics_path: /metrics
    static_configs:
      - targets: ["flask:5000"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
